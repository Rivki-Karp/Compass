# Render Blueprint for Compass: one Blueprint creates both services (prep only: nothing is
# deployed until someone creates the Blueprint in the dashboard; docs/demo-runbook.md, "Deploy").
#
#   compass-api  the backend: a Docker web service built from backend/ alone (API only)
#   compass-web  the UI: a static site built from frontend/
#
# With rootDir set, Render resolves dockerfilePath, dockerContext, buildCommand and
# staticPublishPath inside that directory, so they name ./Dockerfile, . and dist.
#
# Free plan, no persistent disk: the session databases (/data/app.db) live in the container's
# own filesystem and are lost on every restart or deploy, and so is the daily spend counter kept
# in them. The hard spend limit is the Anthropic Console workspace limit (runbook section 9).
# One instance, no autoscaling: the agent's per-session workers and locks live in memory, so one
# process (the image runs --workers 1). The image listens on $PORT, which Render sets.
#
# Secrets are declared by name only (sync: false): Render asks for each value when the Blueprint
# is created, and they are never in the repo. Everything else is set here; VITE_API_BASE_URL is
# public by design (it is baked into the UI's JavaScript).

services:
  - type: web
    name: compass-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    numInstances: 1 # and no `scaling` block: never more than one
    autoDeployTrigger: "off" # deploy by hand from the dashboard, never on a push
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPASS_REP_TOKEN
        sync: false
      - key: COMPASS_ADMIN_TOKEN
        sync: false
      - key: COMPASS_LLM
        value: anthropic
      - key: COMPASS_TRUST_PROXY # Render's proxy is in front (runbook section 8)
        value: "1"
      - key: COMPASS_DAILY_SPEND_CAP_USD
        value: "5"
      - key: COMPASS_MESSAGE_RATE_PER_MINUTE
        value: "20"
      - key: COMPASS_CORS_ORIGINS # the UI's origin, exactly (no slash, no wildcard)
        value: https://compass-web-hcpz.onrender.com
      # Payslip upload (Claude reads the payslip's numbers; ANTHROPIC_API_KEY above): ON in
      # production. The code's default stays 0 (settings.py); this line is the only switch.
      - key: COMPASS_PAYSLIP
        value: "1"
      - key: COMPASS_PAYSLIP_MODEL
        value: claude-haiku-5-5
      - key: COMPASS_PAYSLIP_FALLBACK_MODEL
        value: claude-sonnet-5-5
      - key: COMPASS_PAYSLIP_MAX_BYTES
        value: "5242880"
      - key: COMPASS_PAYSLIP_MAX_PAGES
        value: "3"
      - key: COMPASS_PAYSLIP_PER_SESSION
        value: "3"
      - key: COMPASS_PAYSLIP_TIMEOUT_S
        value: "20"
      # "מאיפה המספר הזה?": a click on a verified number in a reply shows where it came from.
      # ON in production. The code's default stays 0 (settings.py); this line is the only switch.
      - key: COMPASS_NUMBER_SOURCES
        value: "1"
      # Remembered details, with the employee's confirmation (needs accounts): ON in production.
      # The code's default stays 0 (settings.py); this line is the only switch.
      - key: COMPASS_PROFILE_MEMORY
        value: "1"
      # Accounts (login, invite codes, per-user conversations): ON in production.
      # The free plan has no disk: users and history are wiped on every deploy, and the accounts in
      # COMPASS_SEED_USERS (a JSON list of hashes, never passwords: tasks.py hash-password) are
      # re-created at every start. With 1, the static rep/admin tokens are refused.
      - key: COMPASS_AUTH
        value: "1"
      - key: COMPASS_SEED_USERS
        sync: false
      # Judges mode for any logged-in user, unlocked with an admin's password; and one-click login
      # to the shared demo accounts (the ones marked "demo": true in COMPASS_SEED_USERS). Both
      # need accounts. ON in production. The code's default stays 0 (settings.py); these lines are
      # the only switch. The admin password is the unlock secret: 14+ characters
      # (docs/demo-runbook.md, section 12).
      - key: COMPASS_JUDGES_UNLOCK
        value: "1"
      - key: COMPASS_DEMO_LOGIN
        value: "1"

  - type: web
    name: compass-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION # as in frontend/.nvmrc
        value: 22.19.0
      - key: VITE_API_BASE_URL # build time only: baked into the JavaScript, public by design
        value: https://compass-api-tft8.onrender.com
    routes:
      # SPA: any path that is not a file in dist/ (e.g. /rep) gets index.html; files win
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://compass-api-tft8.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
