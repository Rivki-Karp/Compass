# Render Blueprint for Compass: one Blueprint creates both services (prep only: nothing is
# deployed until someone creates the Blueprint in the dashboard; docs/demo-runbook.md, "Deploy").
#
#   compass-api  the backend: a Docker web service built from backend/ alone (API only)
#   compass-web  the UI: a static site built from frontend/
#
# With rootDir set, Render resolves dockerfilePath, dockerContext, buildCommand and
# staticPublishPath inside that directory, so they name ./Dockerfile, . and dist.
#
# Free plan, no persistent disk: the session databases (/data/app.db) live in the container's
# own filesystem and are lost on every restart or deploy, and so is the daily spend counter kept
# in them. The hard spend limit is the Anthropic Console workspace limit (runbook section 9).
# One instance, no autoscaling: the agent's per-session workers and locks live in memory, so one
# process (the image runs --workers 1). The image listens on $PORT, which Render sets.
#
# Secrets are declared by name only (sync: false): Render asks for each value when the Blueprint
# is created, and they are never in the repo. Everything else is set here; VITE_API_BASE_URL is
# public by design (it is baked into the UI's JavaScript).

services:
  - type: web
    name: compass-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    numInstances: 1 # and no `scaling` block: never more than one
    autoDeployTrigger: "off" # deploy by hand from the dashboard, never on a push
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPASS_REP_TOKEN
        sync: false
      - key: COMPASS_ADMIN_TOKEN
        sync: false
      - key: COMPASS_LLM
        value: anthropic
      - key: COMPASS_TRUST_PROXY # Render's proxy is in front (runbook section 8)
        value: "1"
      - key: COMPASS_DAILY_SPEND_CAP_USD
        value: "5"
      - key: COMPASS_MESSAGE_RATE_PER_MINUTE
        value: "20"
      - key: COMPASS_CORS_ORIGINS # the UI's origin, exactly (no slash, no wildcard)
        value: https://compass-web.onrender.com

  - type: web
    name: compass-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION # as in frontend/.nvmrc
        value: 22.19.0
      - key: VITE_API_BASE_URL # build time only: baked into the JavaScript, public by design
        value: https://compass-api.onrender.com
    routes:
      # SPA: any path that is not a file in dist/ (e.g. /rep) gets index.html; files win
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://compass-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
