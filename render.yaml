# Render Blueprint for the Compass backend (prep only: nothing is deployed until someone creates
# the Blueprint in the dashboard; docs/demo-runbook.md, "Deploy").
#
# One web service from backend/Dockerfile, built from backend/ alone (rootDir; Render resolves
# dockerfilePath and dockerContext from the repo root, so both name backend/). It serves the API
# only: the UI is on Cloudflare Pages (frontend/). One instance, no autoscaling (the agent's
# per-session workers and locks live in memory, so one process: the image runs --workers 1).
# The session databases live on a persistent disk at /data (the image's COMPASS_APP_DB).
# The image listens on $PORT, which Render sets.
#
# Set in the dashboard, never in the repo (sync: false: Render asks for each value when the
# Blueprint is created): the three secrets, and COMPASS_CORS_ORIGINS, the Pages URL, known only
# once the frontend is deployed. The other settings are set here.

services:
  - type: web
    name: compass
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # a persistent disk needs a paid plan
    region: frankfurt
    numInstances: 1 # and no `scaling` block: never more than one
    autoDeploy: false # deploy by hand from the dashboard, never on a push
    healthCheckPath: /api/health
    disk:
      name: compass-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPASS_REP_TOKEN
        sync: false
      - key: COMPASS_ADMIN_TOKEN
        sync: false
      - key: COMPASS_CORS_ORIGINS # the Pages origin, e.g. https://compass.pages.dev (no slash)
        sync: false
      - key: COMPASS_LLM
        value: anthropic
      - key: COMPASS_DAILY_SPEND_CAP_USD
        value: "5"
      - key: COMPASS_MESSAGE_RATE_PER_MINUTE
        value: "20"
      - key: COMPASS_TRUST_PROXY # Render's proxy is in front (runbook section 8)
        value: "1"
