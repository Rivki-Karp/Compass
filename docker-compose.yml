# The Compass API with Docker. Pick a profile (PowerShell, from the repo root):
#
#   docker compose --profile demo up --build    # demo mode: scripted model, no API key
#   docker compose --profile live up --build    # Claude: reads backend/.env at run time
#
# The image is built from backend/ alone and serves the API only: http://127.0.0.1:8000/docs.
# For the UI in front of it, run `npm run dev` in frontend/ (Vite proxies /api to :8000) and open
# http://localhost:5173; for one URL with the UI, use `uv run --project backend python tasks.py
# demo` instead. Ctrl+C stops it. The port is bound to 127.0.0.1 only. Secrets are never in the
# image: `live` passes backend/.env to the container when it starts. Each profile has its own
# volume for the session database.
#
# Behind a TLS-inspecting filter or proxy (the build downloads PyPI packages), point
# COMPASS_BUILD_CA at its CA certificates in the shell, e.g.
#   $env:COMPASS_BUILD_CA="C:\ProgramData\NetFree\CA\netfree-ca-list.crt"
# It is a build secret: used for the downloads only, never stored in the image.

x-build: &build
  context: backend
  secrets: [build_ca]

services:
  live:
    profiles: [live]
    build: *build
    image: compass:latest
    env_file: backend/.env # ANTHROPIC_API_KEY, COMPASS_REP_TOKEN, COMPASS_ADMIN_TOKEN, ...
    environment:
      COMPASS_LLM: anthropic
      COMPASS_APP_DB: /data/app.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - compass-live-data:/data
    restart: unless-stopped

  demo:
    profiles: [demo]
    build: *build
    image: compass:latest
    environment:
      COMPASS_LLM: scripted
      COMPASS_DEMO_DB: /data/demo.db
      # demo placeholders, like `tasks.py demo`; a value in the shell wins
      COMPASS_REP_TOKEN: ${COMPASS_REP_TOKEN:-rep-demo}
      COMPASS_ADMIN_TOKEN: ${COMPASS_ADMIN_TOKEN:-admin-demo}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - compass-demo-data:/data

volumes:
  compass-live-data:
  compass-demo-data:

secrets:
  build_ca:
    file: ${COMPASS_BUILD_CA:-./backend/docker/no-build-ca.pem}
