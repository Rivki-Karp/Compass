name: all_options
description: 'E-001 asks for all her options: list_options puts them on screen; the reply leads
  with the top three as a short list (no table) and points to the screen. It may name other
  options after them (round 3, item 2): every number still passes the guard'
turns:
- employee: אני מנהלת מוצר, שכר בסיס 18,500, אין לי עמלות או בונוסים. פנסיה 6%, קרן השתלמות 2.5%, 2.75
    נקודות זיכוי, 2 ילדים מתחת לגיל 23. היום יש לי קורולה קרוס 2025 ואני משתתפת ב-300 ₪. מה כל האפשרויות
    שלי?
checks:
- tool_called:
    name: list_options
    ok: true
# the first three options named are the best three eligible ones (the waiver, MG4, BYD DOLPHIN)
- options_reply:
    top: 3
- reply:
    not_matches:
    # a short list, not a table or headings
    - \|
    - (?m)^#
