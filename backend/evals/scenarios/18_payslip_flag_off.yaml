name: payslip_flag_off
description: 'The upload is off (the default): the employee asks to upload a payslip. A polite "not available", the values asked for in text, no template fallback, no unsourced number'
turns:
- employee: אני מנהלת מוצר, שכר בסיס 18,500. אפשר להעלות תלוש שכר ושתקראי ממנו את שאר
    הנתונים, במקום שאקליד?
checks:
- no_template: {}
- reply:
    turn: 0
    matches:
    - אי אפשר|אין אפשרות|לא (זמין|ניתן|אפשרי|יכול|תומכ|נתמכ)|כרגע לא|עדיין לא
    - כתוב|תכתב|לכתוב|להקליד|תקליד|הקלד|תגיד|ספר|תספר|תענ|לשלוח לי|שתפ
    - פנסיה|קרן השתלמות|עמלות|בונוס|נקודות זיכוי
    not_matches:
    - \|
    - (?m)^#
