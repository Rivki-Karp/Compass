[project]
name = "compass"
version = "0.1.0"
description = "Hebrew assistant that explains how a company-car change affects an employee's monthly net salary."
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.1",
    "openpyxl>=3.1",
    "pydantic>=2",
    "pypdf==6.19.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow==12.3.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "compass"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette now suggests httpx2 for its TestClient; we use httpx as specified.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
# "..": tasks.py lives at the repo root, one level up
pythonpath = [".", ".."]
